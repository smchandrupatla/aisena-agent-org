<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Configuration Management Dashboard for AISENA applications">
  <title>Configuration Management</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .config-container {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
      background: var(--bg);
    }
    
    .config-sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 24px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    
    .config-main {
      padding: 32px;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .config-header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--line);
    }
    
    .config-nav {
      display: flex;
      gap: 8px;
      margin-top: 24px;
    }
    
    .config-nav-item {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    
    .config-nav-item:hover {
      background: var(--bg-soft);
      border-color: var(--line);
    }
    
    .config-nav-item.active {
      background: var(--brand);
      color: white;
    }
    
    .config-section {
      margin-bottom: 32px;
      display: none;
    }
    
    .config-section.active {
      display: block;
    }
    
    .config-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    
    .config-metric-card {
      background: var(--panel);
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--line);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .config-metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
    }
    
    .config-metric-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-card);
    }
    
    .config-metric-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--brand-dark);
      margin: 8px 0;
    }
    
    .config-metric-label {
      color: var(--ink-soft);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .config-form-group {
      margin-bottom: 20px;
    }
    
    .config-form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--ink);
    }
    
    .config-form-input, 
    .config-form-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--panel);
      color: var(--ink);
      font-family: inherit;
    }
    
    .config-form-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--panel);
      color: var(--ink);
      font-family: inherit;
      min-height: 100px;
      resize: vertical;
    }
    
    .config-button {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--brand);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .config-button:hover {
      background: var(--brand-dark);
      transform: translateY(-2px);
    }
    
    .config-button-secondary {
      background: var(--bg-soft);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    
    .config-button-secondary:hover {
      background: var(--line);
    }
    
    .config-dialog {
      background: var(--panel);
      border-radius: var(--radius-lg);
      border: 1px solid var(--line);
      padding: 32px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .config-dialog-header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--line);
    }
    
    .config-tabs {
      display: flex;
      border-bottom: 2px solid var(--line);
      margin-bottom: 24px;
    }
    
    .config-tab {
      padding: 16px 24px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    
    .config-tab:hover {
      background: var(--bg-soft);
    }
    
    .config-tab.active {
      border-bottom-color: var(--brand);
      color: var(--brand);
    }
    
    .config-tab-content {
      display: none;
    }
    
    .config-tab-content.active {
      display: block;
    }
    
    .config-save-status {
      margin-top: 16px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .config-save-success {
      background: rgba(31, 157, 104, 0.1);
      color: var(--ok);
    }
    
    .config-save-error {
      background: rgba(210, 75, 87, 0.1);
      color: var(--warn);
    }
  </style>
</head>
<body>
  <div class="config-container">
    <div class="config-sidebar">
      <div class="config-header">
        <h2>Configuration Management</h2>
      </div>
      
      <div class="config-nav">
        <div class="config-nav-item active" data-section="general">General</div>
        <div class="config-nav-item" data-section="features">Feature Flags</div>
        <div class="config-nav-item" data-section="performance">Performance</div>
        <div class="config-nav-item" data-section="security">Security</div>
      </div>
      
      <div id="configNavButtons">
        <!-- Nav buttons will be populated by JS -->
      </div>
      
      <div id="configDialog" class="config-dialog" style="display: none;">
        <div class="config-dialog-header">
          <h3>Configuration Details</h3>
          <button class="config-button config-button-secondary" onclick="closeConfigDialog()">✕</button>
        </div>
        <div id="configContent"></div>
        <div id="configSaveStatus" class="config-save-status"></div>
      </div>
    </div>
    
    <div class="config-main">
      <div class="config-header">
        <h1>Application Configuration</h1>
      </div>
      
      <div id="configSections">
        <!-- Content will be generated by JS -->
      </div>
    </div>
  </div>

  <script src="config-dashboard.js"></script>
</body>
</html>
