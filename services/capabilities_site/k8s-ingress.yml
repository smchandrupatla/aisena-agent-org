apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capabilities-site-ingress
  labels:
    app: aisena-capabilities-site
    component: frontend
    environment: production
  annotations:
    # Traefik configuration
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certResolver: letsencrypt
    traefik.ingress.kubernetes.io/router.tls.domains[0].main: aisena.local
    traefik.ingress.kubernetes.io/router.tls.domains[0].sans: '*.aisena.local'
    
    # Security annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rpm: "100"
    nginx.ingress.kubernetes.io/limit-conn: "100"
    
    # CORS
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range"
    
    # File upload specific
    nginx.ingress.kubernetes.io/max-upload-size: "10m"
    nginx.ingress.kubernetes.io/proxy-upload-file: "true"
    
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - aisena.local
    - '*.aisena.local'
    secretName: capabilities-site-tls
  rules:
  - host: aisena.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: capabilities-site
            port:
              number: 3000
  - host: '*.aisena.local'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: capabilities-site
            port:
              number: 3000