<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create New Project</title>
  <style>
    /* Basic reset */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; line-height: 1.5; background: #f5f5f5; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { margin-bottom: 10px; }
    .stepper { counter-reset: step; margin-bottom: 20px; }
    .stepper-item { counter-increment: step 1; background: #e0e0e0; padding: 8px 12px; border-radius: 4px; font-weight: bold; }
    .stepper-item + .stepper-item { margin-left: 10px; }
    .stepper-item.completed { background: #4caf50; color: white; }
    .step-content { display: none; }
    .step-content.active { display: block; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin: 10px 0; cursor: pointer; transition: box-shadow 0.2s; }
    .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .card.selected { border-color: #4caf50; background: #e8f5e9; }
    .card h3 { margin-bottom: 8px; }
    .card p { margin: 4px 0; color: #555; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    textarea { resize: vertical; min-height: 60px; }
    .next, .back { margin-top: 20px; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    .next { background: #4caf50; color: white; }
    .back { background: #e0e0e0; color: #333; }
    .upload-zone { border: 2px dashed #bbb; padding: 20px; text-align: center; margin: 20px 0; }
    .upload-zone.highlight { border-color: #4caf50; background: #e8f5e9; }
    .chat-panel { position: fixed; right: 0; top: 0; width: 320px; height: 100%; background: #fff; border-left: 2px solid #ddd; display: flex; flex-direction: column; }
    .chat-header { background: #4caf50; color: white; padding: 10px; flex-shrink: 0; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 10px; list-style: none; }
    .chat-input { display: flex; border-top: 1px solid #ddd; }
    .chat-input input { flex: 1; padding: 8px; border: none; }
    .chat-input button { padding: 8px 16px; border: none; background: #4caf50; color: white; cursor: pointer; }
    .chip { display: inline-block; background: #e0e0e0; padding: 2px 6px; border-radius: 10px; font-size: 0.8em; margin: 2px; }
    .chip.edited { background: #4caf50; color: white; }
  
    <h1>Create New Project</h1>
    <ol class="stepper" id="stepper">
      <li class="stepper-item" data-step="0" id="step-0">Type</li>
      <li class="stepper-item" data-step="1" id="step-1">Basics</li>
      <li class="stepper-item" data-step="2" id="step-2">Configuration</li>
      <li class="stepper-item" data-step="3" id="step-3">Enterprise Features</li>
      <li class="stepper-item" data-step="4" id="step-4">Deployment</li>
      <li class="stepper-item" data-step="5" id="step-5">Review & Create</li>
    </ol>

    <div id="current-step" class="step-content active">
      <!-- Step 0: Type -->
      <div id="step-0-content">
        <h2>Step 1: Choose Type</h2>
        <p>Select the type of project you want to create.</p>
        <div class="cards-container" style="display: flex; gap: 10px;">
          <div class="card" data-type="web_app" id="card-webapp">
            <h3>Web App</h3>
            <p>Interactive, logged-in product experience (dashboards, tools, SaaS)</p>
          </div>
          <div class="card" data-type="website" id="card-website">
            <h3>Website</h3>
            <p>Marketing/informational site (landing pages, brochure sites, blogs)</p>
          </div>
          <div class="card" data-type="portal" id="card-portal">
            <h3>Portal</h3>
            <p>Access-gated hub for a specific audience (customer portal, partner portal, internal tool)</p>
          </div>
        </div>
        <p style="margin-top: 10px;">
          <em>Hover over a card to see examples.</em>
        </p>
        <button class="next" id="next-step-0">Next</button>
      </div>

      <!-- Step 1: Basics -->
      <div id="step-1-content" class="step-content">
        <h2>Step 2: Basics</h2>
        <div class="form-group">
          <label for="project-name">Name <span style="color: red;">*</span></label>
          <input type="text" id="project-name" placeholder="Enter project name">
        </div>
        <div class="form-group">
          <label for="project-description">Description</label>
          <textarea id="project-description" placeholder="Short purpose statement"></textarea>
        </div>
        <div class="form-group">
          <label for="project-owner">Owner/Team</label>
          <select id="project-owner">
            <option>Current User</option>
          </select>
        </div>
        <div class="form-group">
          <label for="project-visibility">Visibility</label>
          <select id="project-visibility">
            <option>Private</option>
            <option>Team</option>
            <option>Public</option>
          </select>
        </div>
        <button class="next" id="next-step-1">Next</button>
        <button class="back" id="back-step-1">Back</button>
      </div>

      <!-- Step 2: Configuration -->
      <div id="step-2-content" class="step-content">
        <h2>Step 3: Configuration</h2>
        <div id="config-choices">
          <p>Select configuration options for your project type.</p>
        </div>
        <button class="next" id="next-step-2">Next</button>
        <button class="back" id="back-step-2">Back</button>
      </div>

      <!-- Step 3: Enterprise Features -->
      <div id="step-3-content" class="step-content">
        <h2>Step 4: Enterprise Features</h2>
        <div class="section">
          <details style="margin-bottom: 10px;">
            <summary>Database</summary>
            <div class="form-group">
              <label for="db-enable">Enable Database</label>
              <select id="db-enable">
                <option>Off</option>
                <option>On</option>
              </select>
            </div>
          </details>
          <div class="form-group">
            <label for="search-enable">Enable Search</label>
            <select id="search-enable">
              <option>Off</option>
              <option>On</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Enterprise Feature Checklist</label>
          <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <label><input type="checkbox" id="feature-sso"> SSO/SAML/OIDC</label>
            <label><input type="checkbox" id="feature-rbac"> RBAC</label>
            <label><input type="checkbox" id="feature-mfa"> MFA</label>
            <label><input type="checkbox" id="feature-backups"> Backups & DR</label>
          </div>
        </div>
        <button class="next" id="next-step-3">Next</button>
        <button class="back" id="back-step-3">Back</button>
      </div>

      <!-- Step 4: Deployment -->
      <div id="step-4-content" class="step-content">
        <h2>Step 5: Deployment Target</h2>
        <p>Choose how your project will be deployed.</p>
        <div class="cards-container" style="display: flex; gap: 10px;">
          <div class="card" data-target="docker" id="card-docker">
            <h3>Docker</h3>
            <p>Containerized, runs anywhere Docker runs</p>
          </div>
          <div class="card" data-target="executable" id="card-executable">
            <h3>Executable</h3>
            <p>Standalone native desktop binary</p>
          </div>
          <div class="card" data-target="cloud" id="card-cloud">
            <h3>Cloud Service</h3>
            <p>Deployed directly to a managed cloud provider</p>
          </div>
        </div>
        <button class="next" id="next-step-4">Next</button>
        <button class="back" id="back-step-4">Back</button>
      </div>

      <!-- Step 5: Review & Create -->
      <div id="step-5-content" class="step-content">
        <h2>Step 6: Review & Create</h2>
        <div id="review-summary">
          <p>Review your selections and click <strong>Create</strong> to finalize.</p>
        </div>
        <button id="create-btn">Create</button>
        <button class="back" id="back-step-5">Back</button>
      </div>
    </div>

    <!-- Drag & Drop Upload Zone -->
    <div id="upload-zone" class="upload-zone">
      Drag & drop files here, or click to browse
      <input type="file" id="file-upload" multiple style="display: none;">
    </div>

    <!-- Chat Assistant Panel -->
    <div class="chat-panel" style="display: none;">
      <div class="chat-header">AI Assistant</div>
      <ul class="chat-messages" id="chat-messages">
        <li><strong>Assistant:</strong> How can I help you create your project?</li>
      </ul>
      <div class="chat-input">
        <input type="text" id="chat-input" placeholder="Type a message...">
        <button id="chat-send">Send</button>
      </div>
    </div>
  </div>

  <script>
    // Stepper navigation
    const steps = document.querySelectorAll('.step-content');
    const stepperItems = document.querySelectorAll('.stepper-item');
    let currentStep = 0;

    function showStep(index) {
      steps.forEach(s => s.classList.remove('active'));
      steps[index].classList.add('active');
      currentStep = index;
      // Update stepper item colors
      stepperItems.forEach(item => {
        if (parseInt(item.dataset.step) < currentStep) {
          item.classList.add('completed');
        } else if (parseInt(item.dataset.step) === currentStep) {
          item.classList.remove('completed');
        } else {
          item.classList.remove('completed');
        }
      });
    }

    document.querySelectorAll('.next').forEach(btn => {
      btn.addEventListener('click', () => {
        if (currentStep < steps.length - 1) {
          showStep(currentStep + 1);
        }
      });
    });

    document.querySelectorAll('.back').forEach(btn => {
      btn.addEventListener('click', () => {
        if (currentStep > 0) {
          showStep(currentStep - 1);
        }
      });
    });

    // Type card selection
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        // Remove selection from all cards
        document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        // Add selection to clicked card
        card.classList.add('selected');
        // Store selected type
        const selectedType = card.dataset.type;
        // Save to global variable
        window.selectedType = selectedType;
        // Show a confirmation
        alert(`Selected type: ${selectedType}`);
      });
    });

    // Drag & Drop upload zone
    const uploadZone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('file-upload');
    let uploadedFiles = [];

    uploadZone.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      handleFiles(files);
      fileInput.value = ''; // Reset input
    });

    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('highlight');
    });

    uploadZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('highlight');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('highlight');
      const files = Array.from(e.dataTransfer.files);
      handleFiles(files);
    });

    function handleFiles(files) {
      for (const file of files) {
        if (file.size > 25 * 1024 * 1024) {
          alert(`File ${file.name} exceeds the 25MB limit.`);
          continue;
        }
        // Simple validation for allowed types
        const allowedTypes = ['application/pdf', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'text/plain', 'text/csv', '.png', '.jpg', '.jpeg'];
        const ext = file.name.toLowerCase().split('.').pop();
        if (!allowedTypes.includes(ext) && !allowedTypes.includes(file.type)) {
          alert(`File type ${file.type} is not supported.`);
          continue;
        }
        uploadedFiles.push(file);
        displayFileCard(file);
      }
    }

    function displayFileCard(file) {
      const card = document.createElement('div');
      card.className = 'chip';
      card.textContent = file.name;
      // Add remove button
      const remove = document.createElement('span');
      remove.textContent = '✕';
      remove.style.cursor = 'pointer';
      remove.addEventListener('click', () => {
        card.remove();
        uploadedFiles = uploadedFiles.filter(f => f !== file);
      });
      card.appendChild(remove);
      document.getElementById('upload-zone').appendChild(card);
    }

    // Chat assistant
    const chatPanel = document.querySelector('.chat-panel');
    const chatToggle = document.createElement('button');
    chatToggle.textContent = '💬';
    chatToggle.style.position = 'fixed';
    chatToggle.style.bottom = '20px';
    chatToggle.style.right = '20px';
    chatToggle.style.padding = '10px';
    chatToggle.style.background = '#4caf50';
    chatToggle.style.color = 'white';
    chatToggle.style.border = 'none';
    chatToggle.style.borderRadius = '4px';
    chatToggle.style.cursor = 'pointer';
    document.body.appendChild(chatToggle);

    chatToggle.addEventListener('click', () => {
      chatPanel.style.display = chatPanel.style.display === 'flex' ? 'none' : 'flex';
    });

    const messages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');

    chatSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      const li = document.createElement('li');
      li.textContent = `You: ${text}`;
      messages.appendChild(li);
      chatInput.value = '';
      // Simulate assistant response
      setTimeout(() => {
        const resp = document.createElement('li');
        resp.innerHTML = `<strong>Assistant:</strong> Thank you for your message. For now, this is a mock assistant.`;
        messages.appendChild(resp);
      }, 500);
    }

    // Review & Create
    document.getElementById('create-btn').addEventListener('click', () => {
      alert('Creating project... (mock)');
    });
  </script>
</body>
</html>
