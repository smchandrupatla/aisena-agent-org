apiVersion: apps/v1
kind: Deployment
metadata:
  name: capabilities-site
  labels:
    app: aisena-capabilities-site
    component: frontend
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aisena-capabilities-site
  template:
    metadata:
      labels:
        app: aisena-capabilities-site
        component: frontend
        environment: production
    spec:
      containers:
      - name: capabilities-site
        image: aisena/capabilities-site:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "/api"
        - name: UPLOAD_MAX_SIZE
          value: "5242880"  # 5MB in bytes
        - name: UPLOAD_ALLOWED_TYPES
          value: "application/json,application/yaml,text/plain,text/markdown"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: site-data
          mountPath: /app/public
        - name: uploads
          mountPath: /tmp/uploads
      volumes:
      - name: site-data
        emptyDir: {}
      - name: uploads
        emptyDir: {}