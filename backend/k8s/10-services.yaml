apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: aisena-hsfs
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: aisena/hsfs-api-gateway:latest
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: hsfs-config }
            - secretRef: { name: hsfs-secrets }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: aisena-hsfs
spec:
  selector: { app: api-gateway }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
