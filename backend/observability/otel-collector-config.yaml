extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  resource/hsfs:
    attributes:
      - key: service.namespace
        value: aisena-hsfs
        action: upsert
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource/hsfs, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [resource/hsfs, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [resource/hsfs, batch]
      exporters: [debug]
