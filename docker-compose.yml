version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: aisena
      POSTGRES_PASSWORD: aisena_pw
      POSTGRES_DB: aisena
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"

  opensearch:
    image: opensearchproject/opensearch:2.9.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"

  grafana:
    image: grafana/grafana-oss:10.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - agent-manager

  agent-manager:
    build:
      context: .
      dockerfile: Dockerfile.agent-manager
    environment:
      - AGENT_AUTO_PUSH=true
      - AGENT_METRICS_PORT=9500
      - AGENT_METRICS_PATH=/metrics
      - OPENSEARCH_URL=http://opensearch:9200
      - POSTGRES_DSN=host=postgres dbname=aisena user=aisena password=aisena_pw
    ports:
      - "9500:9500"
    volumes:
      - .:/workspace:cached
    depends_on:
      - postgres
      - kafka
      - opensearch

  capabilities-site:
    build:
      context: ./services/capabilities_site
      dockerfile: Dockerfile
    ports:
      - "8081:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - API_BASE_URL=http://api:5000
    depends_on:
      - agent-manager
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.capabilities-site.rule=Host(`aisena.local`)"
      - "traefik.http.routers.capabilities-site.entrypoints=web"
      - "traefik.http.services.capabilities-site.loadbalancer.healthcheck.path=/"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      - POSTGRES_DSN=host=postgres dbname=aisena user=aisena password=aisena_pw
      - COPILOT_GITHUB_TOKEN=${COPILOT_GITHUB_TOKEN:-}
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - KAFKA_TOPIC=aisena-stage0-events
    depends_on:
      - kafka
    restart: "no"

  detection:
    build:
      context: .
      dockerfile: services/detection/Dockerfile
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - KAFKA_TOPIC=aisena-stage0-events
      - POSTGRES_DSN=host=postgres dbname=aisena user=aisena password=aisena_pw
      - OPENSEARCH_URL=http://opensearch:9200
    depends_on:
      - kafka
      - postgres
      - opensearch
    restart: unless-stopped

  loki:
    image: grafana/loki:2.8.1
    ports:
      - "3100:3100"

  redmine:
    image: redmine:5.0
    depends_on:
      - postgres
    environment:
      REDMINE_DB_POSTGRES: postgres
      REDMINE_DB_DATABASE: aisena
      REDMINE_DB_USERNAME: aisena
      REDMINE_DB_PASSWORD: aisena_pw
    ports:
      - "3001:3000"

  apicurio-registry:
    image: apicurio/apicurio-registry-mem:2.1.3.Final
    ports:
      - "8080:8080"

  vault:
    image: vault:1.13.3
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
    command: server -dev -dev-root-token-id=root
    ports:
      - "8200:8200"

volumes:
  pgdata:
  opensearch-data:
