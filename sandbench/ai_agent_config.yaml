# AISENA Agent Configuration

# Agent name and identity
agent_name: "AISENA"
agent_version: "1.0.0"

# Task categories
categories:
  - reasoning
  - planning
  - tool_use
  - knowledge
  - interaction

# Performance metrics
metrics:
  - accuracy
  - latency
  - resource_usage
  - success_rate

# Resource limits
limits:
  cpu: "4 cores"
  memory_gb: "16"
  gpu: "1"

# Training parameters
training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  validation_freq: 10

# Evaluation settings
evaluation:
  num_runs: 5
  confidence_threshold: 0.95
  report_format: "json"
