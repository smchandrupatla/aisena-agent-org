version: '3.8'

services:
  webportal:
    build: ./webportal
    container_name: aisena-webportal
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=production
      - AISENA_API_URL=http://aisena:8080
    depends_on:
      - aisena
    networks:
      - aisena-network
    restart: unless-stopped

  aisena:
    build: .
    container_name: aisena-agent
    ports:
      - "8081:8080"
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:-default-token}
    networks:
      - aisena-network
    restart: unless-stopped

networks:
  aisena-network:
    driver: bridge
