version: '3.8'

services:
  aisena:
    build: .
    container_name: aisena-agent
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:-default-token}
      - DATABASE_HOST=db.example.com
      - REDIS_HOST=redis.example.com
    volumes:
      - ./ai_agent_config.yaml:/app/ai_agent_config.yaml
      - ./benchmarks:/app/benchmarks
      - ./infrastructure:/app/infrastructure
      - ./dev-tools:/app/dev-tools
    networks:
      - aisena-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: aisena-db
    environment:
      POSTGRES_DB: aisena_db
      POSTGRES_USER: aisena
      POSTGRES_PASSWORD: aisena_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aisena-network

  redis:
    image: redis:7-alpine
    container_name: aisena-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - aisena-network

volumes:
  pgdata:
  redisdata:

networks:
  aisena-network:
    driver: bridge
