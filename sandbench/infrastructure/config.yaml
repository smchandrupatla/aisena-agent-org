# Infrastructure Configuration for AISENA

# Server settings
server:
  host: "localhost"
  port: 8080
  workers: 4
  max_connections: 100

# Database configuration
database:
  type: "postgresql"
  host: "db.example.com"
  port: 5432
  name: "aisena_db"
  pool_size: 20

# Cache settings
cache:
  backend: "redis"
  host: "redis.example.com"
  port: 6379
  ttl: 3600

# Monitoring
monitoring:
  enabled: true
  metrics_port: 9090
  log_level: "info"

# Security
security:
  tls_enabled: true
  auth_token: "${AUTH_TOKEN}"
  rate_limit: 100
