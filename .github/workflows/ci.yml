name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.txt -r services/orchestrator/requirements.txt

      - name: Test API service
        working-directory: services/api
        run: python -m unittest test_app.py -v

      - name: Test orchestrator service
        working-directory: services/orchestrator
        run: python -m unittest test_orchestrator.py -v

      - name: Test event framework and agent scripts
        run: python -m unittest services.eventing.test_framework scripts.agents.test_daily_self_learning -v

      - name: Runtime ops (flags, recovery, tenant)
        run: python -m unittest services.runtime_ops.test_runtime_ops -v

      - name: Application extraction script
        run: python -m unittest scripts.test_extract_application_repo -v

      - name: Feature-health regression suite
        run: python -m unittest tests.test_feature_health -v

  crm-portal:
    name: CRM portal tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/crm-portal
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build portal
        run: npm run build

  schema-validation:
    name: Event schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/schemas
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate schemas
        run: npm run validate

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate framework stack
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate backend stack
        run: docker compose -f backend/docker-compose.yml config --quiet

      - name: Validate Selenium stack
        run: docker compose -f docker-compose.selenium.yml config --quiet

  gui-screens:
    name: Selenium HTML screen suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run GUI screen tests (Docker Compose + Selenium)
        run: |
          docker compose -f docker-compose.selenium.yml up --build --abort-on-container-exit --exit-code-from gui-tests

      - name: Tear down GUI stack
        if: always()
        run: docker compose -f docker-compose.selenium.yml down -v
