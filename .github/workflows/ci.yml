name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-integrity:
    name: API integrity guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject PLACEHOLDER or truncated services/api/app.py
        run: |
          set -euo pipefail
          APP="services/api/app.py"
          if [ ! -f "$APP" ]; then
            echo "::error file=$APP::services/api/app.py is missing"
            exit 1
          fi
          LINES=$(wc -l < "$APP")
          SIZE=$(wc -c < "$APP")
          echo "app.py lines=$LINES bytes=$SIZE"
          if [ "$LINES" -lt 1000 ]; then
            echo "::error file=$APP::services/api/app.py has only $LINES lines (expected >= 1000). Possible PLACEHOLDER overwrite."
            exit 1
          fi
          if grep -qE 'PLACEHOLDER|raise SystemExit\\(.incomplete.\\)|Temporary marker' "$APP"; then
            echo "::error file=$APP::services/api/app.py contains PLACEHOLDER / incomplete marker"
            exit 1
          fi
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('$APP').read_text(encoding='utf-8')); print('syntax OK')"

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    needs: api-integrity
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.txt -r services/orchestrator/requirements.txt

      - name: Test API service
        working-directory: services/api
        run: python -m unittest test_app.py -v

      - name: Test orchestrator service
        working-directory: services/orchestrator
        run: python -m unittest test_orchestrator.py -v

      - name: Test event framework and agent scripts
        run: python -m unittest services.eventing.test_framework scripts.agents.test_daily_self_learning -v

      - name: Feature-health regression suite
        run: python -m unittest tests.test_feature_health -v

  crm-portal:
    name: CRM portal tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/crm-portal
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build portal
        run: npm run build

  schema-validation:
    name: Event schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/schemas
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate schemas
        run: npm run validate

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate docker-compose.selenium.yml
        run: docker compose -f docker-compose.selenium.yml config --quiet
