name: Sample Capability Demo CI

on:
  push:
    paths:
      - "samples/github-capability-demo/**"
      - ".github/workflows/sample-capability-demo.yml"
  pull_request:
    paths:
      - "samples/github-capability-demo/**"
      - ".github/workflows/sample-capability-demo.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/github-capability-demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
