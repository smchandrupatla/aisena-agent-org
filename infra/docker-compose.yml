version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: aisena
      POSTGRES_PASSWORD: aisena_pw
      POSTGRES_DB: aisena
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      - POSTGRES_DSN=host=postgres dbname=aisena user=aisena password=aisena_pw
      - PROMPT_ALLOW_LOCAL_AUTH=true
      - COPILOT_GITHUB_TOKEN=${COPILOT_GITHUB_TOKEN:-}
      - SPLUNK_API_URL=${SPLUNK_API_URL:-https://splunk:8089}
      - SPLUNK_USERNAME=${SPLUNK_USERNAME:-admin}
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-}
      - SPLUNK_HEC_INDEX=${SPLUNK_HEC_INDEX:-main}
      - DYNATRACE_API_URL=${DYNATRACE_API_URL:-}
      - DYNATRACE_API_TOKEN=${DYNATRACE_API_TOKEN:-}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    restart: unless-stopped

  capabilities-site:
    build:
      context: ../services/capabilities_site
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - API_BASE_URL=http://api:5000
    ports:
      - "8081:3000"
    depends_on:
      - api
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"

  opensearch:
    image: opensearchproject/opensearch:2.9.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"

  grafana:
    image: grafana/grafana-oss:10.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - agent-manager

  agent-manager:
    build:
      context: ..
      dockerfile: Dockerfile.agent-manager
    environment:
      - AGENT_AUTO_PUSH=true
      - AGENT_METRICS_PORT=9500
      - AGENT_METRICS_PATH=/metrics
    ports:
      - "9500:9500"
    volumes:
      - ..:/workspace:cached
    depends_on:
      - postgres
      - kafka
      - opensearch

  loki:
    image: grafana/loki:2.8.1
    ports:
      - "3100:3100"

  redmine:
    image: redmine:5.0
    depends_on:
      - postgres
    environment:
      REDMINE_DB_POSTGRES: postgres
      REDMINE_DB_DATABASE: aisena
      REDMINE_DB_USERNAME: aisena
      REDMINE_DB_PASSWORD: aisena_pw
    ports:
      - "3001:3000"

  apicurio-registry:
    image: apicurio/apicurio-registry-mem:2.1.3.Final
    ports:
      - "8080:8080"

  vault:
    image: vault:1.13.3
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
    command: server -dev -dev-root-token-id=root
    ports:
      - "8200:8200"

volumes:
  pgdata:
  opensearch-data:
