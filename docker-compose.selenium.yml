# Selenium GUI tests for AISENA (capabilities_site).
#
# Coverage:
#   - Screen smoke for every HTML page
#   - Top-bar navigation and in-page links
#   - Tasks / Issues dialogs, filters, quick actions
#   - Agents chat + cross-check controls
#   - Observability viewer toolbars
#
# Usage:
#   docker compose -f docker-compose.selenium.yml up --build --abort-on-container-exit --exit-code-from gui-tests
#   docker compose -f docker-compose.selenium.yml down -v
#
# Or via helper:
#   ./scripts/run-gui-tests.sh
#   ./scripts/run-gui-tests.ps1

name: aisena-gui-tests

services:
  capabilities-site:
    build:
      context: ./services/capabilities_site
    expose:
      - "3000"

  selenium:
    image: selenium/standalone-chrome:4.27.0
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    expose:
      - "4444"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  gui-tests:
    build:
      context: .
      dockerfile: tests/gui/Dockerfile
    environment:
      SITE_BASE_URL: http://capabilities-site:3000
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      PYTHONPATH: /app
    depends_on:
      capabilities-site:
        condition: service_started
      selenium:
        condition: service_healthy
    command: ["pytest", "-v", "--tb=short", "tests/gui"]
