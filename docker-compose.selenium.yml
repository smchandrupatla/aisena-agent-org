# Selenium GUI tests for AISENA HTML screens (capabilities_site).
#
# Usage:
#   docker compose -f docker-compose.selenium.yml up --build --abort-on-container-exit --exit-code-from gui-tests
#   docker compose -f docker-compose.selenium.yml down -v
#
# Or via helper:
#   ./scripts/run-gui-tests.ps1
#
# Stack:
#   capabilities-site  - Node static/portal server for services/capabilities_site
#   selenium           - Selenium standalone Chrome
#   gui-tests          - pytest + Selenium screen suite (tests/gui)

name: aisena-gui-tests

services:
  capabilities-site:
    build:
      context: ./services/capabilities_site
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  selenium:
    image: selenium/standalone-chrome:4.27.0
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    expose:
      - "4444"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  gui-tests:
    build:
      context: .
      dockerfile: tests/gui/Dockerfile
    environment:
      SITE_BASE_URL: http://capabilities-site:3000
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      PYTHONPATH: /app
    depends_on:
      capabilities-site:
        condition: service_started
      selenium:
        condition: service_healthy
    command: ["pytest", "-v", "--tb=short", "tests/gui/test_html_screens.py"]
