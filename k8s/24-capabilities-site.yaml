apiVersion: apps/v1
kind: Deployment
metadata:
  name: capabilities-site
  namespace: aisena
  labels:
    app: capabilities-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capabilities-site
  template:
    metadata:
      labels:
        app: capabilities-site
    spec:
      containers:
      - name: capabilities-site
        image: aisena/capabilities-site:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: aisena-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: uploads
          mountPath: /tmp/uploads
      volumes:
      - name: uploads
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: capabilities-site
  namespace: aisena
spec:
  selector:
    app: capabilities-site
  ports:
  - port: 3000
    targetPort: 3000
    name: http
