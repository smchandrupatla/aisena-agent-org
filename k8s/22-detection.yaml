apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection
  namespace: aisena
  labels:
    app: detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detection
  template:
    metadata:
      labels:
        app: detection
    spec:
      containers:
      - name: detection
        image: aisena/detection:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: aisena-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
