# Dev-mode Vault (in-memory, unsealed). Do not use this pattern in production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: aisena
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: vault:1.13.3
        args: ["server", "-dev", "-dev-root-token-id=$(VAULT_DEV_ROOT_TOKEN_ID)"]
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
        ports:
        - containerPort: 8200
        env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          valueFrom:
            secretKeyRef:
              name: aisena-secrets
              key: VAULT_DEV_ROOT_TOKEN_ID
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: aisena
spec:
  selector:
    app: vault
  ports:
  - port: 8200
    targetPort: 8200
