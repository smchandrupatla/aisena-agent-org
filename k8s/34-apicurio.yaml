apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-registry
  namespace: aisena
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apicurio-registry
  template:
    metadata:
      labels:
        app: apicurio-registry
    spec:
      containers:
      - name: apicurio-registry
        image: apicurio/apicurio-registry-mem:2.1.3.Final
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio-registry
  namespace: aisena
spec:
  selector:
    app: apicurio-registry
  ports:
  - port: 8080
    targetPort: 8080
